<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>采集 · 知识库工作流工具</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>知识库工作流工具</div>
    <nav class="nav">
      <a href="/">总览</a>
      <a href="/collect" class="active">采集</a>
      <a href="/clean">整理</a>
      <a href="/report">报告</a>
      <a href="/library">笔记库</a>
      <a href="/graph-page">知识结构</a>
      <a href="/tasks">任务</a>
      <a href="/settings">设置</a>
      <a href="/wizard">初始化向导</a>
    </nav>
    <span class="api-status" id="apiStatus">…</span>
  </header>

  <div class="wrap">
    <h1>采集</h1>
    <p class="sub">方式一：粘贴正文；方式二：抓取链接；方式三：AI 按方向采集（只需给主题）。所有采集自动按规范入库（双链/骨架页）。</p>

    <div class="panel">
      <h2>粘贴正文</h2>
      <label>标题（留空取首行）</label>
      <input id="txtTitle" type="text" placeholder="文章标题" />
      <label>正文 / HTML</label>
      <textarea id="txt" placeholder="粘贴文章正文或 HTML…"></textarea>
      <div class="row" style="margin-top:10px">
        <input id="txtTopic" type="text" placeholder="主题" />
        <input id="txtTags" type="text" placeholder="标签（逗号分隔）" />
        <button class="btn" onclick="doCollect('text', this)">粘贴入库</button>
      </div>
    </div>

    <div class="panel">
      <h2>抓取链接</h2>
      <div class="row">
        <input id="url" type="text" placeholder="https://example.com/article" />
        <input id="urlTopic" type="text" placeholder="主题（留空自动归类）" />
        <input id="urlTags" type="text" placeholder="标签（逗号分隔）" />
        <button class="btn" onclick="doCollect('url', this)">采集并入库</button>
      </div>
    </div>

    <div class="panel">
      <h2>AI 方向采集 <span class="tag">需 LLM</span></h2>
      <div style="color:var(--c-dim);font-size:13px;line-height:1.7;margin-bottom:10px">输入一个采集方向（主题/话题/问题），AI 按所选提示词模板自动组织内容并规范入库（含实体/概念双链、可选个人思考）。</div>
      <div class="row">
        <input id="direction" type="text" placeholder="如：AI 芯片人才流动；苹果发布新 AI 助手；2026 新能源车市场…" />
        <select id="dirTemplate"></select>
        <button class="btn" onclick="doDirection(this)">AI 采集并入库</button>
      </div>
      <div class="progress" id="dirProgress" hidden><i></i></div>
    </div>

    <div class="progress" id="taskProgress" hidden><i></i></div>
  </div>

  <script src="/js/common.js?v=4"></script>
  <script>
    async function doCollect(kind, btn) {
      if (btn) btn.disabled = true;
      var body;
      if (kind === "url") {
        var url = document.getElementById("url").value.trim();
        if (!url) { if (btn) btn.disabled = false; return toast("请输入链接", true); }
        // URL 格式校验：拦截无效地址，避免提交一个必失败的采集任务
        if (!/^https?:\/\/[^\s]+$/i.test(url)) {
          if (btn) btn.disabled = false;
          return toast("链接格式无效：需以 http:// 或 https:// 开头", true);
        }
        body = { url: url, topic: document.getElementById("urlTopic").value.trim(), tags: splitTags("urlTags") };
      } else {
        var text = document.getElementById("txt").value.trim();
        if (!text) { if (btn) btn.disabled = false; return toast("请粘贴正文", true); }
        body = { text: text, title: document.getElementById("txtTitle").value.trim(), topic: document.getElementById("txtTopic").value.trim(), tags: splitTags("txtTags") };
      }
      try {
        var r = await api.post("/api/collect", body);
        toast("已提交采集任务");
        document.getElementById("taskProgress").hidden = false;
        pollTask(r.task_id, function (res) {
          if (btn) btn.disabled = false;
          var msg = res && res.dedup && res.dedup.hit
            ? "已存在相同内容，去重命中（更新原笔记）"
            : "采集完成：" + (res && res.note_id ? res.note_id : "");
          toast(msg);
        });
      } catch (e) { if (btn) btn.disabled = false; toast("提交失败：" + e.message, true); }
    }
    async function doDirection(btn) {
      var direction = document.getElementById("direction").value.trim();
      if (!direction) return toast("请输入采集方向", true);
      if (direction.length > 80) return toast("采集方向过长（≤80 字），请精简", true);
      if (btn) btn.disabled = true;
      try {
        var r = await api.post("/api/collect/direction", {
          direction: direction,
          template: document.getElementById("dirTemplate").value
        });
        toast("已提交 AI 方向采集");
        document.getElementById("dirProgress").hidden = false;
        pollTask(r.task_id, function (res) {
          if (btn) btn.disabled = false;
          if (res && res.error) return toast("AI 采集失败：" + res.error, true);
          var cleaned = res && res.cleaned ? res.cleaned : {};
          var n = res && res.note_id ? res.note_id : "";
          var sk = cleaned && cleaned.skeletons ? cleaned.skeletons : null;
          toast("AI 采集完成：" + n + (sk ? "（新建实体+" + sk.entity + " 概念+" + sk.concept + "）" : ""));
        });
      } catch (e) {
        if (btn) btn.disabled = false;
        // 未配置 LLM 等：给出明确引导跳转设置
        if (/LLM|API Key|api_key/i.test(e.message)) {
          toast(e.message, true);
          if (confirm("该功能需要配置 LLM API Key\n\n前往「设置」页完成配置？")) location.href = "/settings";
        } else {
          toast("提交失败：" + e.message, true);
        }
      }
    }
    // 下拉动态加载提示词模板（内置 + 自定义），默认选中 deep
    async function loadDirTemplates() {
      var sel = document.getElementById("dirTemplate");
      try {
        var d = await api.get("/api/prompts");
        sel.innerHTML = (d.templates || []).map(function (t) {
          return '<option value="' + esc(t.name) + '">' + esc(t.label) + "</option>";
        }).join("") || '<option value="deep">深度分析（含个人思考）</option>';
        var def = d.default || "deep";
        sel.value = (d.templates || []).some(function (t) { return t.name === def; }) ? def : sel.value;
      } catch (e) {
        sel.innerHTML = '<option value="deep">深度分析（含个人思考）</option>';
      }
    }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    loadDirTemplates();
    function splitTags(id) {
      return document.getElementById(id).value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
    }
  </script>
</body>
</html>
