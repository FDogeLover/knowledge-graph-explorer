<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初始化向导 · 知识库工作流工具</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>知识库工作流工具</div>
    <nav class="nav">
      <a href="/">总览</a>
      <a href="/collect">采集</a>
      <a href="/clean">整理</a>
      <a href="/report">报告</a>
      <a href="/library">笔记库</a>
      <a href="/graph-page">知识结构</a>
      <a href="/tasks">任务</a>
      <a href="/settings">设置</a>
      <a href="/wizard" class="active">初始化向导</a>
    </nav>
  </header>

  <div class="wrap" style="max-width:680px">
    <h1>初始化向导</h1>
    <p class="sub">空库或首次使用，3 步引导建目录结构与模板。幂等：重复运行只补齐缺失，不覆盖已有笔记。</p>

    <div class="panel">
      <div id="stepInfo" style="font-size:13px;color:var(--c-dim);margin-bottom:12px"></div>
      <div id="stepBody"></div>
      <div style="margin-top:14px;display:flex;justify-content:space-between">
        <button class="btn ghost" id="prevBtn" onclick="step(-1)">上一步</button>
        <button class="btn" id="nextBtn" onclick="step(1)">下一步</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js?v=4"></script>
  <script>
    var cur = 1;
    var done = false;   // 是否已执行初始化（第 5 步按钮或第 5→6 兜底）
    var state = { root: "", topics: [], seed: false };

    function render() {
      var info = document.getElementById("stepInfo");
      var body = document.getElementById("stepBody");
      document.getElementById("prevBtn").disabled = cur === 1;
      var nextBtn = document.getElementById("nextBtn");
      nextBtn.style.display = "inline-flex";
      nextBtn.textContent = cur === 3 ? (done ? "完成 → 去总览" : "跳过 → 创建空库") : "下一步";

      if (cur === 1) {
        info.textContent = "第 1/3 步 · 数据目录";
        body.innerHTML = '<label>数据根目录（留空使用默认 data/）</label><input id="root" type="text" placeholder="如 D:\\knowledge\\my-notes" value="' + state.root + '">' +
          '<div style="color:var(--c-dim);font-size:12.5px;line-height:1.7;margin-top:8px">默认使用「文章」笔记模板（meta.schema.json + article.md）：采集后正文存 body.md、元数据存 meta.json；可直接被 Obsidian 打开、可 git 版本管理。</div>';
      } else if (cur === 2) {
        info.textContent = "第 2/3 步 · 主题与标签";
        body.innerHTML = '<label>预置主题（逗号分隔，可留空后改）</label><input id="topics" type="text" placeholder="技术,商业,人文,科学,生活" value="' + state.topics.join(",") + '">' +
          '<div style="color:var(--c-dim);font-size:12.5px;line-height:1.7;margin-top:8px">整理器基于内置关键词规则自动打标签（如含"AI/算法"→ AI），规则可在 app/cleaner.py 中维护。</div>';
      } else {
        info.textContent = "第 3/3 步 · 初始形态";
        if (done) {
          body.innerHTML =
            '<div style="color:#2f9e7a;font-size:14px;line-height:1.8">✅ 初始化完成。<br>' +
            (state.seed ? "已加载示例知识库（双链示例：来源/实体/概念），可直接在「知识结构」页查看图谱。" : "已创建空库。可从「采集」页用链接 / 粘贴 / AI 方向采集开始收录内容。") +
            '<br>数据根目录：<code>' + (state.root || "data/") + "</code></div>";
        } else {
          body.innerHTML =
            '<div style="color:var(--c-dim);font-size:13px;line-height:1.7;margin-bottom:10px">选择一个初始形态：<b>开箱即用</b>（加载示例：3 来源 + 4 实体 + 4 概念的双链知识库）或<b>从零开始</b>（空库，之后自行采集）。</div>' +
            '<div class="row"><button type="button" class="btn" id="useSeedBtn">加载示例知识库</button>' +
            '<button type="button" class="btn ghost" id="emptyBtn">从空库开始</button></div>' +
            '<div style="color:var(--c-dim);font-size:12px;margin-top:12px">也可直接点「跳过 → 创建空库」</div>';
          var b1 = document.getElementById("useSeedBtn");
          var b2 = document.getElementById("emptyBtn");
          b1.onclick = function () { b1.disabled = true; b2.disabled = true; initNow(true); };
          b2.onclick = function () { b1.disabled = true; b2.disabled = true; initNow(false); };
        }
      }
    }

    function readForm() {
      if (document.getElementById("root")) state.root = document.getElementById("root").value.trim();
      if (document.getElementById("topics")) {
        state.topics = document.getElementById("topics").value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
      }
    }

    async function initNow(seed) {
      // 初始化期间禁用导航（防并发执行）
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      prevBtn.disabled = true; nextBtn.disabled = true;
      readForm();
      try {
        await api.post("/api/setup", { root: state.root || null, topics: state.topics.length ? state.topics : null, templates: true });
        if (seed) { await api.post("/api/setup/seed", {}); }
        state.seed = seed;
        done = true;
        cur = 3;
        render();
        nextBtn.disabled = false;
        toast(seed ? "示例知识库已加载 ✅" : "空库已创建 ✅");
      } catch (e) { prevBtn.disabled = false; nextBtn.disabled = false; toast("初始化失败：" + e.message, true); }
    }

    // 上一步 / 下一步 / 完成：统一入口
    document.getElementById("prevBtn").onclick = function () { if (cur > 1) { cur--; render(); } };
    document.getElementById("nextBtn").onclick = function () {
      if (cur === 3) {
        if (done) { location.href = "/"; return; }       // 已完成 → 总览
        initNow(false); return;                            // 跳过 → 默认空库初始化
      }
      if (cur < 3) { cur++; render(); }
    };
    render();
  </script>
</body>
</html>
