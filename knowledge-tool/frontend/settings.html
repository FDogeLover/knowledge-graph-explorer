<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置 · 知识库工作流工具</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>知识库工作流工具</div>
    <nav class="nav">
      <a href="/">总览</a>
      <a href="/collect">采集</a>
      <a href="/clean">整理</a>
      <a href="/report">报告</a>
      <a href="/library">笔记库</a>
      <a href="/graph-page">知识结构</a>
      <a href="/tasks">任务</a>
      <a href="/settings" class="active">设置</a>
      <a href="/wizard">初始化向导</a>
    </nav>
  </header>

  <div class="wrap">
    <h1>设置</h1>
    <p class="sub">数据目录、主题与标签规则。当前运行期不调用 AI，可离线使用。</p>

    <div class="panel">
      <h2>数据目录</h2>
      <div id="rootInfo" style="color:var(--c-dim);font-size:13px">加载中…</div>
    </div>

    <div class="panel">
      <h2>主题</h2>
      <div id="topicsBox"></div>
    </div>

    <div class="panel">
      <h2>标签</h2>
      <div id="tagsBox"></div>
    </div>

    <div class="panel">
      <h2>关于正式版</h2>
      <p style="color:var(--c-dim);font-size:13px;line-height:1.7">
        正式完整版 =「知识库工作流工具」（Python + FastAPI + 原生前端 + 文件数据层，Linux/Docker 部署）。
        「知识图谱探索器」是它的前端「知识结构」展示视图。本工具一期为纯手动可控，二期预留定时调度与 AI 增强。
      </p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    async function load() {
      try {
        var st = await api.get("/api/setup/status");
        document.getElementById("rootInfo").textContent = "数据根目录：" + st.root + "（已初始化：" + st.initialized + "）";
        var tp = await api.get("/api/topics");
        document.getElementById("topicsBox").innerHTML = (tp.topics || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") || "暂无主题";
        var tg = await api.get("/api/tags");
        document.getElementById("tagsBox").innerHTML = (tg.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") || "暂无标签";
      } catch (e) { toast("加载失败：" + e.message, true); }
    }
    load();
  </script>
</body>
</html>
