<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务中心 · 知识库工作流工具</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>知识库工作流工具</div>
    <nav class="nav">
      <a href="/">总览</a>
      <a href="/collect">采集</a>
      <a href="/clean">整理</a>
      <a href="/report">报告</a>
      <a href="/library">笔记库</a>
      <a href="/graph-page">知识结构</a>
      <a href="/tasks" class="active">任务</a>
      <a href="/settings">设置</a>
      <a href="/wizard">初始化向导</a>
    </nav>
  </header>

  <div class="wrap">
    <h1>任务中心</h1>
    <p class="sub">采集 / 全库整理 / 生成报告等长任务在此查看进度。</p>
    <button class="btn ghost" onclick="load()">刷新</button>
    <div style="height:12px"></div>
    <table>
      <thead><tr><th>任务</th><th>状态</th><th>进度</th><th>创建时间</th><th>结果</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <script src="/js/common.js?v=2"></script>
  <script>
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    async function load() {
      try {
        var d = await api.get("/api/tasks");
        var body = document.getElementById("body");
        body.innerHTML = d.tasks.length ? "" : '<tr><td colspan="5" style="color:var(--c-dim)">暂无任务</td></tr>';
        d.tasks.forEach(function (t) {
          var tr = document.createElement("tr");
          var color = t.status === "done" ? "#2f9e7a" : t.status === "error" ? "#e04f4f" : "#f59e0b";
          tr.innerHTML = "<td>" + esc(t.name) + "</td>" +
            '<td style="color:' + color + '">' + esc(t.status) + "</td>" +
            '<td><div class="progress" style="width:120px"><i style="width:' + Math.round((t.progress || 0) * 100) + '%"></i></div></td>' +
            "<td>" + esc(t.created_at) + "</td>" +
            "<td style='font-size:12px;color:var(--c-dim)'>" + esc(JSON.stringify(t.result || t.error || "")) + "</td>";
          body.appendChild(tr);
        });
      } catch (e) { toast("加载失败：" + e.message, true); }
    }
    load();
    setInterval(load, 2500);
  </script>
</body>
</html>
