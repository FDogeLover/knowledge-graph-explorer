<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识结构 · 知识库工作流工具</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .graph-stage { position: relative; height: 68vh; border: 1px solid var(--c-border); border-radius: var(--radius); overflow: hidden; isolation: isolate;
      background:
        radial-gradient(800px 500px at 50% 40%, #14203a 0%, var(--c-bg) 60%),
        radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.4px);
      background-size: auto, 22px 22px;   /* 深色底 + 微弱点阵，增强空间深度 */
    }
    .graph-stage #vp { position: absolute; inset: 0; transform-origin: 0 0; z-index: 1; }

    /* ===== 节点：统一精致胶囊卡片 system ===== */
    .gnode {
      position: absolute; transform: translate(-50%,-50%);
      display: flex; align-items: center; justify-content: flex-start; text-align: left;
      cursor: pointer; user-select: none; padding: 6px 12px; box-sizing: border-box;
      border: 1px solid; border-radius: 999px;   /* 统一胶囊 */
      transition: box-shadow .25s ease, opacity .25s ease, filter .25s ease, background .25s ease, border-color .25s ease;
      white-space: nowrap; gap: 6px;
    }
    .gnode .gicon { font-size: 12px; line-height: 1; flex-shrink: 0; opacity: .85; }
    .gnode .gtext {
      pointer-events: none; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;  /* 单行定宽截断 */
      display: inline-block; max-width: 170px; min-width: 0;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      line-height: 1.35;
    }
    .gnode.type-entity .gtext { font-size: 13.5px; }
    .gnode.type-concept .gtext { font-size: 12.5px; }
    .gnode.type-source .gtext { font-size: 11.5px; font-weight: 500; }

    /* 未选中（静态态）：精致半透明胶囊，低对比但不脏——星空/脑图感 */
    .gnode { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.12); color: #b9c4d6; }
    .gnode:hover { z-index: 15; filter: brightness(1.15); }
    /* 一级关联：浅色底 + 类型色描边 */
    .gnode.rel { background: rgba(255,255,255,.10); border-color: var(--gc); color: #fff; box-shadow: 0 0 0 1px var(--gc); }
    /* 选中焦点：霓虹发光 */
    .gnode.focus { background: rgba(255,255,255,.14); border-color: var(--gc); color: #fff;
      box-shadow: 0 0 14px var(--gc), 0 0 4px var(--gc), 0 4px 18px rgba(0,0,0,.5); z-index: 20; }
    /* 非关联：保持结构可见的弱化态（浅透明胶囊，非灰脏） */
    .gnode.dim { opacity: .72; background: rgba(255,255,255,.035); border-color: rgba(255,255,255,.08); color: rgba(200,210,230,.38); box-shadow: none; filter: none; }
    /* 径向聚焦态：无关节点进一步极淡隐退，让「中心+环形邻居」成为绝对视觉主体 */
    .graph-stage.radial-on .gnode.dim {
      opacity: .15; background: transparent; border-color: rgba(255,255,255,.05);
      color: rgba(200,210,230,.20); pointer-events: none;
    }
    .graph-stage.radial-on .gnode.dim .gicon { opacity: .22; }
    .graph-stage.radial-on .gnode.dim .gdeg { opacity: .2; }
    .gnode.ghost { opacity: .4; }   /* 收起态弱显示 */

    .gnode .gdeg {
      position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 999px; background: #0b111b; border: 1px solid var(--gc);
      color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
      opacity: .9; pointer-events: none;
    }

    /* ===== 边 ===== */
    .gedge { position: absolute; height: 2px; transform-origin: 0 50%; pointer-events: none; }
    /* 默认（未选中态）：所有连线低透明度，禁止任何"未选中节点间高亮连线" */
    .gedge i { position: absolute; inset: 0; opacity: .14; }
    .gedge i.ent { border-top: 2px solid; }
    .gedge i.con { border-top: 2.5px dashed; opacity: .14; }
    /* 仅与选中节点直接相连的边才 100% 高亮：霓虹渐变流光 */
    @keyframes edgeflow { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .gedge.active i, .gedge.active i.con {
      border-top: 0 !important; height: 2px; opacity: 1;
      background: linear-gradient(90deg, transparent, var(--gc), transparent);
      background-size: 200% 100%;
      animation: edgeflow 2.6s linear infinite;
      box-shadow: 0 0 8px var(--gc);
    }
    /* 非选中节点关联边：压到极低，视觉上近乎隐藏 */
    .gedge.faded { opacity: .05; }
    .gedge.faded i, .gedge.faded i.con { opacity: .05; }
    /* 关系名：仅悬停邻接节点时以弹窗显示（不再常驻线上） */
    .gedge-label {
      position: absolute; left: 0; top: 0; transform: translate(-50%,-140%);
      font-size: 10px; white-space: nowrap; padding: 2px 7px; border-radius: 999px;
      background: rgba(8,12,20,.92); border: 1px solid rgba(255,255,255,.16); color: #e6edf7;
      pointer-events: none; z-index: 6; opacity: 0; transition: opacity .15s;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .edge-label-show .gedge-label { opacity: 1; }
    .gnode.loading { opacity: 0; }

    /* 提示浮条：右下角小胶囊、毛玻璃 */
    .graph-hint {
      position: absolute; right: 14px; bottom: 12px; z-index: 5;
      display: flex; align-items: center; gap: 5px;
      font-size: 10.5px; color: rgba(233,240,250,.72);
      background: rgba(11,17,27,.5); padding: 4px 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(8px);
      pointer-events: none; white-space: nowrap; letter-spacing: .3px;
    }
    /* 图例说明：右上角 ℹ️ 小按钮 + 点击弹窗 */
    .graph-legend-btn {
      position: absolute; top: 12px; right: 12px; z-index: 40; cursor: pointer;
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--c-border);
      background: rgba(11,17,27,.7); color: var(--c-dim); font-size: 15px; line-height: 1;
      display: flex; align-items: center; justify-content: center; transition: all .18s;
    }
    .graph-legend-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); }
    .legend-modal {
      position: absolute; top: 50px; right: 12px; width: 260px; z-index: 40;
      border: 1px solid var(--c-border); border-radius: 12px; background: rgba(11,17,27,.95);
      padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    .legend-modal h4 { font-size: 12px; letter-spacing: 1px; margin-bottom: 8px; color: var(--c-text); }
    .legend-modal .lm-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; color: var(--c-dim); }
    .legend-modal .lm-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .legend-modal .lm-dot.card { border-radius: 5px; }

    /* 连线穿透：画布层 z-index 1 < 节点20 < 面板60；面板不穿透 */
    .g-detail { position: absolute; top: 50px; right: 12px; width: 320px; max-height: calc(100% - 66px); overflow: auto; border: 1px solid var(--c-border); border-radius: 12px; background: rgba(11,17,27,0.96); padding: 16px; z-index: 60; box-shadow: 0 8px 30px rgba(0,0,0,.5); }

    /* ===== 搜索 / 类型过滤工具条 ===== */
    .graph-tools { position: absolute; top: 12px; left: 12px; z-index: 35; display: flex; gap: 8px; align-items: center; }
    .gsearch { width: 190px; padding: 6px 12px; font-size: 12.5px; border-radius: 999px; background: rgba(11,17,27,.72); border: 1px solid var(--c-border); color: var(--c-text); outline: none; transition: border-color .18s; }
    .gsearch:focus { border-color: #4c8bf5; }
    .gsearch::placeholder { color: rgba(233,240,250,.45); }
    .gtypes { display: flex; gap: 4px; background: rgba(11,17,27,.72); padding: 3px; border-radius: 999px; border: 1px solid var(--c-border); }
    .gtypes button { border: none; background: transparent; color: var(--c-dim); font-size: 11.5px; padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: all .15s; }
    .gtypes button:hover { color: var(--c-text); }
    .gtypes button.active { background: #4c8bf5; color: #fff; font-weight: 600; }
    .gtypes-btn {
      border: 1px solid var(--c-border); background: rgba(76,139,245,.12);
      color: #9fc0ff; font-size: 11.5px; padding: 6px 12px; border-radius: 999px;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .gtypes-btn:hover { background: rgba(76,139,245,.25); color: #fff; }
    .g-detail-close {
      position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; padding: 0;
      display: flex; align-items: center; justify-content: center; cursor: pointer; border: none;
      border-radius: 50%; background: rgba(255,255,255,.08); color: var(--c-dim);
      font-size: 13px; line-height: 1; transition: all .15s;
    }
    .g-detail-close:hover { background: rgba(255,255,255,.18); color: #fff; }
    .g-detail .d-type { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10.5px; letter-spacing: 1px; border: 1px solid; margin-bottom: 10px; }
    .g-detail .d-title { font-size: 19px; font-weight: 700; margin: 2px 0 10px; line-height: 1.35; }
    .g-detail .d-desc { font-size: 13.5px; color: #d3dbe8; line-height: 1.7; }
    .g-detail .md-body p { margin: 6px 0; line-height: 1.75; }
    .g-detail .md-body h4, .g-detail .md-body h5 { margin: 10px 0 6px; color: var(--c-text); }
    .g-detail .md-body ul { margin: 4px 0 8px; padding-left: 18px; }
    .g-detail .md-body li { line-height: 1.7; margin: 3px 0; }
    .g-detail .md-body code { background: rgba(255,255,255,.08); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
    .g-detail .md-body .md-wiki { color: var(--c-accent); background: rgba(224,79,79,.1); border-radius: 4px; padding: 1px 5px; }
    .g-detail h4 { font-size: 11px; color: var(--c-dim); letter-spacing: 1.8px; margin: 16px 0 8px; border-top: 1px solid var(--c-glass-border); padding-top: 14px; }
    .g-detail .tag {/* 相关标签去重合并后：#标签/#关键词同用 */
      display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px;
      background: rgba(76,139,245,.15); color: #c4d8f8; margin: 3px 5px 0 0; }
    .g-detail .tag.kw { background: rgba(245,158,11,.13); color: #f3cf9b; }  /* 关键词同组但反馈不同色 */
    .g-detail .meta-row { font-size: 11.5px; color: var(--c-dim); margin: 2px 0; }
    .g-detail .d-link { display: block; margin-top: 8px; font-size: 12px; color: #7fb2ff; word-break: break-all; }
    .g-detail .rel-chip { display: block; padding: 7px 10px; margin: 4px 0; border-radius: 8px; font-size: 12.5px; color: var(--c-text); cursor: pointer; transition: background .15s; border-left: 2px solid transparent; line-height: 1.5; word-break: break-all; }
    .g-detail .rel-chip:hover { background: rgba(255,255,255,.06); border-left-color: var(--gc); }
    /* AI 聚合补全按钮（实体/概念详情内） */
    .d-agg {
      display: inline-block; margin: 10px 0 2px; padding: 5px 12px; cursor: pointer;
      font-size: 11.5px; color: #7fb2ff; border: 1px solid rgba(127,178,255,.35);
      border-radius: 999px; background: rgba(127,178,255,.08); transition: all .15s;
    }
    .d-agg:hover { background: rgba(127,178,255,.18); border-color: #7fb2ff; }
    .d-agg:disabled { opacity: .5; cursor: not-allowed; }

    @media (max-width: 700px) {
      .g-detail { left: 8px; right: 8px; top: auto; bottom: max(8px, env(safe-area-inset-bottom, 8px)); width: auto; max-height: 55vh; border-radius: 16px; }
      .graph-hint { right: 10px; bottom: max(10px, env(safe-area-inset-bottom, 10px)); }
      .graph-tools { top: 10px; left: 10px; right: 10px; flex-wrap: wrap; gap: 6px; }
      .gsearch { flex: 1; min-width: 120px; }
      .gtypes button { padding: 4px 8px; font-size: 11px; }
      .gnode.type-entity .gtext { font-size: 13px; }
      .gnode.type-concept .gtext { font-size: 11.5px; }
      .gnode.type-source .gtext { font-size: 10.5px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>知识库工作流工具</div>
    <nav class="nav">
      <a href="/">总览</a>
      <a href="/collect">采集</a>
      <a href="/clean">整理</a>
      <a href="/report">报告</a>
      <a href="/library">笔记库</a>
      <a href="/graph-page" class="active">知识结构</a>
      <a href="/tasks">任务</a>
      <a href="/settings">设置</a>
      <a href="/wizard">初始化向导</a>
    </nav>
  </header>

  <div class="wrap">
    <h1>知识结构</h1>
    <p class="sub" style="display:none">（图例见右上角 ℹ️）</p>

    <div class="graph-stage" id="stage">
      <div id="vp"></div>
      <div class="graph-tools" id="gtools">
        <input id="gsearch" class="gsearch" type="text" placeholder="搜索节点… (Ctrl+K)" />
        <div class="gtypes" id="gtypes">
          <button data-t="" class="active">全部</button>
          <button data-t="source">来源</button>
          <button data-t="entity">实体</button>
          <button data-t="concept">概念</button>
        </div>
        <button class="gtypes-btn" id="resetView" title="退出聚焦，回到全貌视图">⇱ 全貌</button>
      </div>
      <button class="graph-legend-btn" id="legendBtn" title="图例说明">ℹ️</button>
      <div class="legend-modal" id="legendModal" hidden>
        <h4>图例说明</h4>
        <div class="lm-item"><span class="lm-dot" style="background:#4c8bf5"></span>来源（蓝色 · 卡片）— 文章/链接/文本</div>
        <div class="lm-item"><span class="lm-dot" style="background:#f59e0b"></span>实体（橙色 · 圆形）— 公司/组织/人物</div>
        <div class="lm-item"><span class="lm-dot" style="background:#a855f7;border-radius:5px"></span>概念（紫色 · 圆角）— 抽象词/趋势</div>
        <h4 style="margin-top:12px">连线</h4>
        <div class="lm-item"><span class="lm-dot" style="background:#4c8bf5;height:3px;border-radius:0"></span>&nbsp;实线 = 实体关联 · 虚线 = 概念关联</div>
        <div class="lm-item"><span class="lm-dot" style="background:transparent"></span>数字角标 = 该节点连接数</div>
      </div>
      <div class="g-detail" id="gdetail" hidden></div>
      <div class="graph-hint" id="ghint">拖动平移 · 滚轮缩放 · 点击查看</div>
    </div>
  </div>

  <script src="/js/common.js?v=3"></script>
  <script>
    (function () {
      "use strict";
      var stage = document.getElementById("stage");
      var vp = document.getElementById("vp");
      var g = { nodes: [], byId: {}, edges: [], rawNodes: [], rawEdges: [], zoom: 1, pan: { x: 0, y: 0 }, selected: null, fType: "", radialEnabled: false };

      function apply() { vp.style.transform = "translate(" + g.pan.x + "px," + g.pan.y + "px) scale(" + g.zoom + ")"; }

      /* 样式常量：按类型 */
      var STYLE = {
        entity:  { shape: "circle", min: 54,  max: 92,  font: 14 },
        concept: { shape: "card",   min: 46,  max: 74,  font: 12.5 },
        source:  { shape: "card",   min: 40,  max: 66,  font: 11 }
      };

      /* ===== 确定性布局（放弃纯力导向）=====
     坐标全部由数学公式算死，不做物理迭代——彻底规避"斥力散开/引力堆叠"摆动：
     - 全貌（Overview）：实体→右侧扇形、概念→左侧扇形、来源→底部横排网格
     - 焦点（Focus 径向）：选中节点定中心，一级邻居按 2π/n 均匀圆周，
       二级邻居外环，其余非焦点按类型沉降背景外围网格
     矩形碰撞仅作最后兜底，保证绝对零重叠。 */

      // 胶囊矩形包围盒估算
      function measureNodes() {
        g.nodes.forEach(function (nd) {
          var f = nd.type === "entity" ? 13.5 : nd.type === "concept" ? 12.5 : 11.5;
          var textW = ((nd.label || "").length) * f * 0.98 + 4;
          nd._rw = Math.max(72, Math.min(textW, 170) + 30 + 22);
          nd._rh = 34;
          nd._cr = Math.max(36, nd._rw / 2 + 12);
        });
      }
      // 矩形碰撞分离（兜底，margin 14/10）
      function collidePass(list) {
        list = list || g.nodes;
        for (var i = 0; i < list.length; i++) {
          var a = list[i];
          for (var k = i + 1; k < list.length; k++) {
            var b = list[k];
            var dx = a.x - b.x, dy = a.y - b.y;
            var needX = (a._rw + b._rw) / 2 + 14;
            var needY = (a._rh + b._rh) / 2 + 10;
            var ovX = needX - Math.abs(dx), ovY = needY - Math.abs(dy);
            if (ovX > 0 && ovY > 0) {
              if (ovX < ovY) {
                var s = dx >= 0 ? 1 : -1;
                a.x += s * ovX; b.x -= s * ovX;
              } else {
                var s2 = dy >= 0 ? 1 : -1;
                a.y += s2 * ovY; b.y -= s2 * ovY;
              }
            }
          }
        }
      }
      // 扇形放置（角度均分→半径分层，弧长不足自动加大半径）
      function fanPlace(nodes, cx, cy, a0, a1, r0) {
        var n = nodes.length; if (!n) return;
        var span = Math.max(a1 - a0, 0.001);
        // 每环可容纳数：按平均胶囊宽×中间半径弧长计算
        var avgW = 118;
        var midR = r0 + 90;
        var perRing = Math.max(3, Math.floor((midR * span) / avgW));
        var rings = Math.ceil(n / perRing) || 1;
        var ringStep = avgW * 1.1;
        nodes.forEach(function (nd, i) {
          var ring = Math.floor(i / perRing), k = i % perRing;
          var t = perRing > 1 ? k / (perRing - 1) : 0.5;
          // 保证弧长 ≥ 胶囊宽：r 至少需 span/(perRing-1)*avgW
          var rMin = avgW * Math.max(perRing - 1, 1) / span;
          var r = Math.max(r0 + ring * ringStep, rMin + ring * ringStep);
          var ang = a0 + span * t;
          nd.x = cx + r * Math.cos(ang);
          nd.y = cy + r * Math.sin(ang);
        });
      }
      // 网格放置（avatar 底部横排）
      function gridPlace(nodes, cx, cy, width, rows) {
        var n = nodes.length; if (!n) return;
        var perRow = Math.max(1, Math.ceil(n / rows));
        var cellW = Math.min(132, width / perRow);
        nodes.forEach(function (nd, i) {
          var row = Math.floor(i / perRow), col = i % perRow;
          var x = cx - (perRow - 1) * cellW / 2 + col * cellW;
          var y = cy + (row - (rows - 1) / 2) * 48;
          nd.x = x; nd.y = y;
        });
      }
      // 全貌：三区确定性排布
      function layoutOverview() {
        var W = stage.clientWidth || 800, H = stage.clientHeight || 500;
        var cx = W / 2, cy = H / 2;
        var groups = { entity: [], concept: [], source: [] };
        g.nodes.forEach(function (nd) { (groups[nd.type] || groups.source).push(nd); });
        fanPlace(groups.entity, cx, cy, -1.22, 1.22, Math.min(W, H) * 0.16);          // 右侧扇形
        fanPlace(groups.concept, cx, cy, Math.PI - 1.22, Math.PI + 1.22, Math.min(W, H) * 0.20);  // 左侧扇形
        gridPlace(groups.source, cx, H * 0.88, W * 0.86, 2);                            // 底部横排
        for (var r = 0; r < 50; r++) collidePass();
      }
      // 焦点：径向确定性布局（选中节点定中心）
      function layoutFocus(fid) {
        var W = stage.clientWidth || 800, H = stage.clientHeight || 500;
        var panel = W > 700 ? 340 : 0;
        var cx = (W - panel) / 2, cy = H / 2;
        var A = g.byId[fid]; if (!A) return;
        var placed = { };
        A.x = cx; A.y = cy; placed[A.id] = true;
        // 一级：均匀圆周 R1
        var ones = [];
        g.edges.forEach(function (e) {
          if (e.from === fid) { var O = g.byId[e.to]; if (O && ones.indexOf(O) < 0) ones.push(O); }
          else if (e.to === fid) { var P = g.byId[e.from]; if (P && ones.indexOf(P) < 0) ones.push(P); }
        });
        var n1 = ones.length || 1;
        var avgW = 118;
        var R1 = Math.max(180, (n1 * avgW) / (2 * Math.PI) * 1.25);
        ones.forEach(function (nd, i) {
          var ang = -Math.PI / 2 + (i / n1) * 2 * Math.PI;
          var r = R1;
          nd.x = cx + r * Math.cos(ang); nd.y = cy + r * Math.sin(ang);
          placed[nd.id] = true;
        });
        // 二级：邻居的邻居（均匀外环）
        var twos = [];
        ones.forEach(function (o) {
          var adj = g.adj[o.id];
          if (!adj) return;
          adj.forEach(function (p) {
            if (p !== fid && !placed[p] && g.byId[p] && twos.indexOf(g.byId[p]) < 0) twos.push(g.byId[p]);
          });
        });
        if (twos.length) {
          var R2 = R1 + Math.min(W, H) * 0.34;
          twos.forEach(function (nd, i) {
            var ang = -Math.PI / 2 + (i / twos.length) * 2 * Math.PI;
            nd.x = cx + R2 * Math.cos(ang); nd.y = cy + R2 * Math.sin(ang);
            placed[nd.id] = true;
          });
        }
        // 其余：与焦点无关的节点 → 按类型隐退到四角整齐网格（配合聚焦态极淡，不抢主体）
        var bins = { entity: [], concept: [], source: [] };
        g.nodes.forEach(function (nd) { if (!placed[nd.id]) (bins[nd.type] || bins.source).push(nd); });
        // 右上：entity 角块；左上：concept 角块；底部：source 横排
        cornerGrid(bins.entity, W * 0.84, H * 0.06 + 26, 4, W);
        cornerGrid(bins.concept, W * 0.16, H * 0.06 + 26, 4, W);
        cornerGrid(bins.source, W * 0.50, H * 0.93, 3, W);
        for (var r = 0; r < 60; r++) collidePass();
      }
      // 角落整齐网格（隐退块：每格宽 132 两行内紧凑排布，clamp 防出界）
      function cornerGrid(nodes, cx, cy, perRow, W) {
        var n = nodes.length; if (!n) return;
        var cellW = 132;
        var perRowN = Math.max(1, Math.min(perRow, n));
        nodes.forEach(function (nd, i) {
          var row = Math.floor(i / perRowN), col = i % perRowN;
          nd.x = cx - (perRowN - 1) * cellW / 2 + col * cellW;
          nd.y = cy + row * 46;
          nd.x = Math.min(W - 40, Math.max(40, nd.x));
          nd.y = Math.min(stage.clientHeight - 30, Math.max(30, nd.y));
        });
      }
      // render 前的入口：计算坐标（全貌模式）
      function layout() {
        measureNodes();
        layoutOverview();
      }

      /* ===== 防贯穿：近垂直的『长』边会被画成竖线贯穿整个画布 =====
         (布局把两节点推到近乎同 x、y 相差上千像素的场景)。对每条这样的边，
         把度数较低的一端绕画布中心微调角度，打斜到明显非竖直。 */
      function desnake() {
        if (g.edges.length < 2) return;
        var W = stage.clientWidth || 800, H = stage.clientHeight || 500;
        var longLimit = Math.max(W, H) * 0.5;
        var cx = W / 2, cy = H / 2;
        var tries = {};
        g.edges.forEach(function (e) {
          var a = g.byId[e.from], b = g.byId[e.to];
          if (!a || !b) return;
          var dx = b.x - a.x, dy = b.y - a.y;
          var len = Math.hypot(dx, dy);
          if (len < longLimit) return;
          // 近垂直：cos 角 ≤0.18（约偏离垂直线 10° 以内都兜住，避免 85° 残留直感）
          var vertical = Math.abs(dx / len) < 0.18;
          if (!vertical) return;
          var nd = (b._deg || 0) < (a._deg || 0) ? b : a;   // 扰动度数较低的一端
          tries[nd.id] = (tries[nd.id] || 0) + 1;
          if (tries[nd.id] > 2) return;
          // 一次打斜约 20°~29°（视半径），让长边明显倾斜而非竖直贯穿
          var rot = tries[nd.id] === 1 ? 0.42 : -0.52;
          var ang = Math.atan2(nd.y - cy, nd.x - cx) + rot;
          var r = Math.hypot(nd.x - cx, nd.y - cy);
          nd.x = cx + r * Math.cos(ang);
          nd.y = cy + r * Math.sin(ang);
        });
      }

      /* ===== 节点尺寸：类型基准 + 度数权重 ===== */
      function sizeFor(nd, deg) {
        var s = STYLE[nd.type] || STYLE.source;
        var d = Math.min(deg || 0, 6);
        // 实体/核心放大，来源（文章）偏小
        var size = s.min + d * 6;
        return Math.min(size, s.max);
      }

      function render(data, opts) {
        opts = opts || {};
        g.nodes = data.nodes; g.byId = {}; g.edges = data.edges; g.adj = {};
        if (!opts.filtered) { g.rawNodes = data.nodes; g.rawEdges = data.edges; }
        g.nodes.forEach(function (nd) { g.byId[nd.id] = nd; });
        var deg = {};
        g.edges.forEach(function (e) { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
        g.nodes.forEach(function (nd) { nd._deg = deg[nd.id]||0; nd._size = sizeFor(nd, nd._deg); });

        // 邻接表（供聚焦/淡化）
        g.adj = {};
        g.nodes.forEach(function (n) { g.adj[n.id] = new Set(); });
        g.edges.forEach(function (e) { g.adj[e.from].add(e.to); g.adj[e.to].add(e.from); });

        layout();
        vp.innerHTML = "";

        // ---- 边（缩短到节点边缘，避免线条贯穿节点；零长度边防御跳过） ----
        // g.edgeEls / g.edgeLabels 与 g.edges 索引严格对齐（跳过的边用 null 占位），
        // 供 focus/syncEdgeLabels 按索引点亮正确边，避免 DOM 缺失导致错位。
        g.edgeEls = []; g.edgeLabels = [];
        data.edges.forEach(function (e) {
          var a = g.byId[e.from], b = g.byId[e.to];
          if (!a || !b) { g.edgeEls.push(null); g.edgeLabels.push(null); return; }
          var dx = b.x - a.x, dy = b.y - a.y;
          var len = Math.hypot(dx, dy);
          if (len < 2) { g.edgeEls.push(null); g.edgeLabels.push(null); return; }  // 防 0/近零长度异常边
          var ang = Math.atan2(dy, dx) * 180 / Math.PI;
          var ux = dx / len, uy = dy / len;
          var r1 = (a._size || 30) / 2 + 4, r2 = (b._size || 30) / 2 + 4;
          var drawLen = len - r1 - r2;
          var ox = a.x + ux * r1, oy = a.y + uy * r1;
          if (drawLen < 8) { drawLen = len; ox = a.x; oy = a.y; }  // 距离不足时回退整线
          var el = document.createElement("div");
          el.className = "gedge";
          el.dataset.edge = "1";
          el.style.cssText = "left:" + ox + "px;top:" + oy + "px;width:" + drawLen + "px;height:2px;transform:rotate(" + ang + "deg)";
          var line = document.createElement("i");
          var isEntity = (e.label || "").indexOf("实体") >= 0;
          line.className = isEntity ? "ent" : "con";
          // --gc 供流光/描边取色
          line.style.cssText = "border-color:" + a.color + ";--gc:" + a.color + ";filter:drop-shadow(0 0 2px " + a.color + "88);";
          el.appendChild(line);
          var lab = document.createElement("div");
          lab.className = "gedge-label";
          lab.style.cssText = "left:" + ((a.x + b.x) / 2) + "px;top:" + ((a.y + b.y) / 2) + "px;";
          lab.textContent = e.label || "";
          vp.appendChild(el);
          vp.appendChild(lab);
          g.edgeEls.push(el);
          g.edgeLabels.push(lab);
        });

        // ---- 节点 ----
        var NODE_ICON = { source: "📄", entity: "👤", concept: "🏷️" };
        g.nodes.forEach(function (nd) {
          var el = document.createElement("div");
          el.className = "gnode type-" + (nd.type || "source");
          // 统一胶囊：类型图标 + 单行省略文本
          el.style.cssText = "left:" + nd.x + "px;top:" + nd.y + "px;color:" + nd.color + ";border-color:" + nd.color + ";--gc:" + nd.color;
          el.title = nd.label;   // Tooltip 完整标题
          el.innerHTML =
            '<span class="gicon">' + (NODE_ICON[nd.type] || "◈") + "</span>" +
            '<span class="gtext">' + esc(nd.label) + "</span>";
          // 度数角标
          if (nd._deg > 1) {
            var b = document.createElement("span");
            b.className = "gdeg"; b.textContent = nd._deg; b.style.setProperty("--gc", nd.color);
            el.appendChild(b);
          }
          el.onclick = function (ev) { ev.stopPropagation(); g.radialEnabled = true; focus(nd.id); };
          // 连线文字：仅当悬停的节点就是当前选中/高亮节点时，才显示其相邻边的关系名；
          // 悬停其他（dimmed/未聚焦）节点 → 完全干净，不触发任何文字。
          el.onmouseenter = function () {
            if (!g.selected || nd.id !== g.selected) return;
            stage.classList.add("edge-label-show");
            g.hoverNode = nd.id;
            syncEdgeLabels();
          };
          el.onmouseleave = function () {
            stage.classList.remove("edge-label-show");
            g.hoverNode = null;
            syncEdgeLabels();
          };
          vp.appendChild(el);
        });

        g.zoom = 1; g.pan = { x: 0, y: 0 };
        fit();
        if (data.nodes.length && opts.autoFocus !== false) {
          g.suppressPan = true;
          g.radialEnabled = false;      // 初次自动聚焦保持全貌扇形，不切径向
          focus(data.nodes[0].id);
          g.suppressPan = false;
        }
      }

      /* ===== 搜索 / 类型过滤：从原始数据按条件构建子集重渲染 ===== */
      function applyFilter() {
        var q = (document.getElementById("gsearch").value || "").trim().toLowerCase();
        var set = g.rawNodes.filter(function (nd) {
          if (g.fType && nd.type !== g.fType) return false;
          if (q && (nd.label || "").toLowerCase().indexOf(q) < 0 && (nd.desc || "").toLowerCase().indexOf(q) < 0) return false;
          return true;
        }).map(function (n) { return n.id; });
        set = new Set(set);
        var nodes = g.rawNodes.filter(function (n) { return set.has(n.id); });
        var edges = g.rawEdges.filter(function (e) { return set.has(e.from) && set.has(e.to); });
        // 过滤后自动聚焦首个匹配节点（搜索→直接看详情），无匹配则提示
        render({ nodes: nodes, edges: edges }, { filtered: true, autoFocus: true });
        var hint = document.getElementById("ghint");
        if (!nodes.length) {
          hint.textContent = q ? "无匹配节点，已清空或调整关键词" : "该类型下暂无节点";
        } else if (!q && !g.fType) {
          hint.textContent = "拖动平移 · 滚轮缩放 · 点击查看 · 输入关键词或选类型可过滤";
        } else {
          hint.textContent = "拖动平移 · 滚轮缩放 · 点击查看";
        }
      }

      function fit() {
        var W = stage.clientWidth, H = stage.clientHeight;
        var xs = g.nodes.map(function (n) { return n.x; }), ys = g.nodes.map(function (n) { return n.y; });
        var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
        var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
        var z = Math.min(W / ((maxX - minX) + 220), H / ((maxY - minY) + 220), 1.5);
        z = Math.max(0.35, z);
        g.fitZoom = z;                            // 记录整图适配缩放，供聚焦放大参考
        g.zoom = z;
        g.pan.x = W / 2 - (minX + maxX) / 2 * z;
        g.pan.y = H / 2 - (minY + maxY) / 2 * z;
        apply();
      }

      /* ===== 聚焦：一二阶高亮 + 无关淡化 ===== */
      function focus(id) {
        g.selected = id;
        g.hoverNode = null;                       // 切换焦点时清空悬停，文字恢复隐藏
        stage.classList.remove("edge-label-show");
        // 图例与详情互斥：聚焦节点时收起图例弹窗
        document.getElementById("legendModal").hidden = true;
        var nodes = vp.querySelectorAll(".gnode");
        var nd = g.byId[id]; if (!nd) return;
        var idx = g.nodes.indexOf(nd);

        // 一阶邻居
        var ones = g.adj[id] ? new Set(g.adj[id]) : new Set();
        function cls(k) {
          // 严格分层：焦点 = 选中节点 + 一级邻居；其余（含二级）全部 dim
          return (k === id) ? ["focus"] : (ones.has(k) ? ["rel"] : ["dim"]);
        }
        nodes.forEach(function (el, i) {
          var nk = g.nodes[i].id;
          el.classList.remove("focus", "dim", "rel", "rel2");
          var c = cls(nk);
          c.forEach(function (x) { el.classList.add(x); });
        });
        // 边高亮/淡化（严格判定）：仅高亮"起点或终点 == 选中节点 A"的直接关联边，
        // 其余所有非关联连线（含一级节点之间、二级、未选中节点间）一律压到极低透明度。
        // 用 g.edgeEls 数组（与 g.edges 索引对齐）而非 DOM 查询，避免索引错位。
        g.edgeEls.forEach(function (el) { if (el) el.classList.remove("active", "faded"); });
        g.edges.forEach(function (e, i) {
          var el = g.edgeEls[i]; if (!el) return;
          if (e.from === id || e.to === id) el.classList.add("active");
          else el.classList.add("faded");
        });
        showDetail(nd);
        if (!g.suppressPan) {
          if (g.radialEnabled) { layoutFocus(nd.id); stage.classList.add("radial-on"); }  // 用户点击 → 径向重排+无关隐退
          applyPositions(nd.id);
        }
      }

      /* 已构建 DOM 上的坐标重排：节点/边/标签按当前 nd.x/y 更新，并居中或全图适配 */
      function applyPositions(centerId) {
        var els = vp.querySelectorAll(".gnode");
        g.nodes.forEach(function (nd, i) { if (els[i]) { els[i].style.left = nd.x + "px"; els[i].style.top = nd.y + "px"; } });
        g.edges.forEach(function (e, i) {
          var el = g.edgeEls[i], lab = g.edgeLabels[i];
          if (!el) return;
          var a = g.byId[e.from], b = g.byId[e.to];
          if (!a || !b) return;
          var dx = b.x - a.x, dy = b.y - a.y;
          var len = Math.hypot(dx, dy);
          if (len < 2) { el.style.display = "none"; if (lab) lab.style.display = "none"; return; }
          el.style.display = "";
          if (lab) lab.style.display = "";
          var ang = Math.atan2(dy, dx) * 180 / Math.PI;
          var r1 = (a._size || 34) / 2 + 4, r2 = (b._size || 34) / 2 + 4;
          var drawLen = len - r1 - r2, ox = a.x + dx / len * r1, oy = a.y + dy / len * r1;
          if (drawLen < 8) { drawLen = len; ox = a.x; oy = a.y; }
          el.style.cssText = "left:" + ox + "px;top:" + oy + "px;width:" + drawLen + "px;height:2px;transform:rotate(" + ang + "deg)";
          if (lab) { lab.style.left = ((a.x + b.x) / 2) + "px"; lab.style.top = ((a.y + b.y) / 2) + "px"; }
        });
        if (centerId && g.byId[centerId]) panIntoView(g.byId[centerId]);
        else fit();
      }

      /* 聚焦定位：把选中节点平移到视口中心并适度放大（fitZoom×2.6，上限 1.15），
         让焦点与直接邻居处于清晰视野；右侧详情面板占位时以剩余空间中心为锚。 */
      function panIntoView(nd) {
        var W = stage.clientWidth, H = stage.clientHeight;
        var panel = W > 700 ? 340 : 0;
        var cx = (W - panel) / 2, cy = H / 2;
        var z = Math.max(0.75, Math.min(1.15, (g.fitZoom || 0.5) * 2.6));
        g.zoom = z;
        g.pan.x = cx - nd.x * z;
        g.pan.y = cy - nd.y * z;
        apply();
      }

      /* 悬停节点时：仅显示其相邻边的关系名（弹窗化）；用 g.edgeLabels 对齐数组 */
      function syncEdgeLabels() {
        g.edgeLabels.forEach(function (l) { if (l) l.style.opacity = "0"; });
        if (!g.hoverNode) return;
        g.edges.forEach(function (e, i) {
          if (e.from === g.hoverNode || e.to === g.hoverNode) {
            var l = g.edgeLabels[i];
            if (l) l.style.opacity = "1";
          }
        });
      }

      /* ===== 详情面板（增强） ===== */
      function showDetail(nd) {
        var d = document.getElementById("gdetail");
        d.hidden = false;
        var typeLabel = ({ source: "来源", entity: "实体", concept: "概念" })[nd.type] || "节点";
        var kw = (nd.keywords || []).slice(0, 10);
        var html = '<button class="g-detail-close" title="关闭详情" aria-label="关闭">✕</button>';
        html += '<span class="d-type" style="color:' + nd.color + '">' + typeLabel + "</span>";
        // 实体/概念：提供 AI 聚合补全（多来源综合成概览，解决节点内容单薄）
        if (nd.type === "entity" || nd.type === "concept") {
          html += '<div><button class="d-agg" data-agg="' + esc(nd.id) + '">✨ AI 聚合补全</button></div>';
        }
        html += '<div class="d-title">' + esc(nd.label) + "</div>";
        // 正文优先（富文本 Markdown 渲染）；无正文则用摘要
        var bodyMd = (nd.body || "").trim();
        var descHtml = bodyMd ? renderMd(bodyMd) : "<p>" + esc(nd.desc || "") + "</p>";
        html += '<div class="d-desc md-body">' + descHtml + "</div>";
        html += '<h4>元信息</h4><div class="meta-row">发布时间：' + esc(nd.date_published || "—") + "</div>";
        // 相关标签：标签 ∪ 关键词，去重合并为一个模块（避免重复展示）
        var tags = (nd.tags || []).slice(0, 12);
        var kw = (nd.keywords || []).slice(0, 10);
        var merged = [];
        tags.forEach(function (t) { if (merged.indexOf(t) < 0) merged.push(t); });
        var kwExtra = kw.filter(function (k) { return merged.indexOf(k) < 0; });
        if (merged.length || kwExtra.length) {
          html += "<h4>相关标签</h4><div>" +
            merged.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") +
            kwExtra.slice(0, 6).map(function (k) { return '<span class="tag kw">' + esc(k) + "</span>"; }).join("") +
            "</div>";
        }
        if (nd.links && (nd.links.entities.length || nd.links.concepts.length)) {
          // 实体/概念：entities=「来源引用」（反向），concepts=关联概念；来源：实体+概念
          if (nd.type === "entity") {
            html += '<h4>来源引用</h4>';
            (nd.links.entities || []).forEach(function (nm) { html += '<div class="rel-chip" data-goto="' + esc(nm) + '">📄 ' + esc(nm) + "</div>"; });
            if ((nd.links.concepts || []).length) {
              html += '<h4>关联概念</h4>';
              (nd.links.concepts || []).forEach(function (nm) { html += '<div class="rel-chip" data-goto="' + esc(nm) + '">◇ ' + esc(nm) + "</div>"; });
            }
          } else if (nd.type === "concept") {
            html += '<h4>来源引用</h4>';
            (nd.links.concepts || []).forEach(function (nm) { html += '<div class="rel-chip" data-goto="' + esc(nm) + '">📄 ' + esc(nm) + "</div>"; });
          } else {
            html += '<h4>关联实体</h4>';
            (nd.links.entities || []).forEach(function (nm) { html += '<div class="rel-chip" data-goto="' + esc(nm) + '">▸ ' + esc(nm) + "</div>"; });
            html += '<h4>关联概念</h4>';
            (nd.links.concepts || []).forEach(function (nm) { html += '<div class="rel-chip" data-goto="' + esc(nm) + '">◇ ' + esc(nm) + "</div>"; });
          }
        }
        if (nd.url) html += '<a class="d-link" href="' + esc(nd.url) + '" target="_blank" rel="noopener">↗ 原文链接</a>';
        d.innerHTML = html;
        // 关闭按钮：关闭详情并退出聚焦复位（不仅是隐藏面板）
        var closeBtn = d.querySelector(".g-detail-close");
        if (closeBtn) closeBtn.onclick = function () { clearFocus(); };
        // AI 聚合补全：调用后端综合各来源生成概览，成功后重拉详情刷新
        var aggBtn = d.querySelector(".d-agg");
        if (aggBtn) aggBtn.onclick = function () {
          var btn = this;
          btn.disabled = true;
          api.post("/api/notes/" + encodeURIComponent(nd.id) + "/aggregate", {}).then(function (r) {
            if (r.skipped) { toast(r.reason || "已跳过（单引用无需聚合）"); btn.disabled = false; return; }
            toast("已聚合补全：" + nd.label);
            api.get("/api/notes/" + encodeURIComponent(nd.id)).then(function (n) {
              nd.body = n.body; nd.summary = n.summary;
              showDetail(nd);
            }).catch(function () { btn.disabled = false; });
          }).catch(function (e) { toast(e.message, true); btn.disabled = false; });
        };
        d.querySelectorAll(".rel-chip").forEach(function (chip) {
          chip.onclick = function () {
            var to = chip.dataset.goto;
            var target = g.byId[to] || g.nodes.filter(function (n) { return n.label === to; })[0];
            if (target) focus(target.id);
          };
        });
      }

      // 平移 / 缩放
      stage.addEventListener("mousedown", function (e) {
        if (e.target.closest(".gnode") || e.target.closest(".g-detail")) return;
        var sx = e.clientX, sy = e.clientY, from = { x: g.pan.x, y: g.pan.y }, dist = 0;
        function mv(ev) {
          var dx = ev.clientX - sx, dy = ev.clientY - sy;
          dist = Math.max(dist, Math.abs(dx) + Math.abs(dy));
          g.pan.x = from.x + dx; g.pan.y = from.y + dy; apply();
        }
        function up() {
          window.removeEventListener("mousemove", mv);
          window.removeEventListener("mouseup", up);
          // 轻点空白（几乎无拖动）→ 退出聚焦回全貌
          if (dist < 6 && g.selected) clearFocus();
        }
        window.addEventListener("mousemove", mv);
        window.addEventListener("mouseup", up);
      });
      stage.addEventListener("wheel", function (e) {
        e.preventDefault();
        var rect = stage.getBoundingClientRect();
        var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
        var nz = Math.min(3, Math.max(0.35, g.zoom * (e.deltaY < 0 ? 1.12 : 0.9)));
        var k = nz / g.zoom;
        g.pan.x = cx - (cx - g.pan.x) * k;
        g.pan.y = cy - (cy - g.pan.y) * k;
        g.zoom = nz; apply();
      }, { passive: false });

      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

      // 轻量 Markdown 渲染（无外部库，CSP 安全）：标题/粗斜/列表/链接/代码/[[双链]]
      function inlineMd(s) {
        var h = esc(s);
        h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
        h = h.replace(/\*([^*]+)\*/g, "<i>$1</i>");
        h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
        h = h.replace(/\[\[([^\]]+)\]\]/g, '<span class="md-wiki">$1</span>');
        h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a class="d-link" href="$2" target="_blank" rel="noopener">$1</a>');
        return h;
      }
      function renderMd(md) {
        var lines = (md || "").split("\n");
        var out = [], list = [];
        function flush() {
          if (list.length) { out.push('<ul>' + list.join("") + "</ul>"); list = []; }
        }
        lines.forEach(function (line) {
          var t = line.trim();
          if (!t) { flush(); return; }
          var m;
          if ((m = t.match(/^(#{1,4})\s+(.*)/))) {
            flush();
            var lv = m[1].length;
            out.push((lv <= 2 ? "<h4>" : "<h5>") + inlineMd(m[2]) + (lv <= 2 ? "</h4>" : "</h5>"));
          } else if ((m = t.match(/^[-*]\s+(.*)/)) || (m = t.match(/^\d+[.)]\s+(.*)/))) {
            list.push("<li>" + inlineMd(m[1]) + "</li>");
          } else if (t.match(/^\|.*\|$/)) {
            flush(); // 表格：降级为纯文本段落
            out.push("<p>" + inlineMd(t.replace(/^\||\|$/g, "").replace(/\|/g, " · ")) + "</p>");
          } else {
            flush();
            out.push("<p>" + inlineMd(t) + "</p>");
          }
        });
        flush();
        return out.join("");
      }

      // 图例按钮：切换弹窗
      var legendBtn = document.getElementById("legendBtn");
      var legendModal = document.getElementById("legendModal");
      legendBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        legendModal.hidden = !legendModal.hidden;
      });
      document.addEventListener("click", function (e) {
        if (!legendModal.hidden && !legendModal.contains(e.target) && e.target !== legendBtn) {
          legendModal.hidden = true;
        }
      });

      /* ===== 搜索 / 类型过滤事件绑定 ===== */
      var gsearch = document.getElementById("gsearch");
      var gtimer = null;
      gsearch.addEventListener("input", function () {
        clearTimeout(gtimer);
        gtimer = setTimeout(applyFilter, 180);   // 防抖：输入即过滤
      });
      document.querySelectorAll("#gtypes button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("#gtypes button").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          g.fType = btn.dataset.t || "";
          applyFilter();
        });
      });
      // ⇱ 全貌：一键退出聚焦，回到三区扇形布局
      document.getElementById("resetView").addEventListener("click", function () {
        clearFocus();
      });
      // Ctrl+K：聚焦搜索框
      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          gsearch.focus();
          gsearch.select();
        }
        // Esc：退出搜索框
        if (e.key === "Escape" && document.activeElement === gsearch) {
          e.preventDefault();
          gsearch.blur();
        }
        // Esc：清空选中 → 恢复全视图并 zoomToFit（禁止节点残留聚焦/贴边）
        if (e.key === "Escape" && document.activeElement !== gsearch && g.selected) {
          clearFocus();
        }
      });

      /* 清空选中：移除一切高亮 class、关详情面板、回到全貌扇形布局并 zoomToFit */
      function clearFocus() {
        g.selected = null; g.hoverNode = null;
        stage.classList.remove("edge-label-show");
        vp.querySelectorAll(".gnode").forEach(function (el) { el.classList.remove("focus", "dim", "rel", "rel2"); });
        vp.querySelectorAll(".gedge").forEach(function (el) { el.classList.remove("active", "faded"); });
        document.getElementById("gdetail").hidden = true;
        g.radialEnabled = false;
        stage.classList.remove("radial-on");
        layoutOverview();
        applyPositions(null);
      }

      // 初次加载：直接渲染（非过滤态），随后 data 可用时保留原始集
      api.get("/api/graph/data").then(function (data) {
        g.rawNodes = data.nodes; g.rawEdges = data.edges;
        render(data);
      }).catch(function (e) {
        document.getElementById("ghint").textContent = "加载失败：" + e.message;
      });
    })();
  </script>
</body>
</html>
